; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

#got most of this from https://esp32s.com/blog
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio

lib_deps =
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl @ 9.3.0

board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; per https://github.com/Bodmer/TFT_eSPI/wiki/Installing-on-PlatformIO this should move User_setup.h reference into ./include/ for git tracking capability
    -D USER_SETUP_LOADED=1
    -include include/User_Setup.h
    ; per https://lvgl.io/docs/open/9.3/details/integration/adding-lvgl-to-your-project/configuration.html this should move lv_conf.h reference into ./include/ for git tracking capability
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
lib_ldf_mode = deep+